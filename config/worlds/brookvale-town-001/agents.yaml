# 溪谷镇人物配置（brookvale-town-001）
# 数值来源：用户裁决（STATUS 里程碑2 A/B/C/D 类参数），设计文档未给的数值已获用户确认。
# 机制/内容分离：本文件提供所有具体数值；Python 代码只读，不写死。

# 说明：标注 [调参] 的为 04-03 阶段为修复"eat/rest 完全主导、无人耕作"而重选的数值，
# 标注 [机制修正] 的为打分量纲归一化；均待你审阅，可随时替换。
tuning:
  physiology:
    hunger_gain_per_tick: 15            # A1：每天饥饿增长
    eat_hunger_reduction: 60            # A2：进食降低饥饿
    eat_grain_cost: 1                   # A3：每次进食消耗粮食（石）
    food_fields: [grain, meat, fish]    # [调参] 任务10：eat 消耗优先级 粮>肉>鱼；粮不足依次吃后续字段
    hunger_health_damage_threshold: 80  # A4：饥饿超过此值开始掉健康
    hunger_health_damage: 8             # A4：每天健康损耗
    rest_stamina_recovery: 40           # A5：休息恢复体力
    initial_health: 90                  # A6：开局健康
    initial_hunger: 40                  # A6：开局饥饿
    initial_stamina: 80                 # A6：开局体力
    initial_fatigue: 0                  # A6：开局疲劳

  utility:
    need_weights: { survival: 3.0, stamina: 2.0, economy: 1.5, safety: 0.0, social: 0.0 }  # [调参] 公式改为 weight×urgency×fulfill 后重平衡的权重
    economy_urgency_grain_zero: 1.0     # B2：断粮时经济紧缺度
    economy_urgency_grain_positive: 1.0 # [调参] 耕作始终有产出价值，故有粮时经济紧缺度也取 1.0（原 0.2/0.3）
    move_stamina_per_tu: 5              # B5/C2：移动每 TU 体力消耗（状态扣减）
    stamina_score_divisor: 100          # [机制修正] 打分体力惩罚 = raw_cost / 100，与 gross 同量级
    distance_penalty_per_tu: 0.15       # [调参] B8：距离惩罚 = 往返 TU × 该值（原 2.0）
    rain_outdoor_score_multiplier: 0.5  # B9：雨天户外动作得分乘数

  action:
    fulfill:                            # B4：动作对各需求的满足值
      eat: { survival: 1.0 }
      rest: { survival: 0.5, stamina: 1.0 }  # [调参] 原 0.6；新增 stamina 满足，体力越低越倾向休息
      farm: { economy: 1.8 }            # [调参] 耕作的经济满足值
      collect_water: { survival: 0.3 }
      harvest: { economy: 4.0 }         # 秋收：高经济满足，仅秋季且长势达标可行
      borrow_grain: { survival: 0.8 }   # [调参] 任务10：3.0→0.8，必须 < eat(1.0)——有任何食物时吃饭优先，断粮才借粮；否则借粮会压过 eat，导致守着鱼/肉却互借倒手、债务爆炸而饿死
      # 采集类 survival 满足必须 < eat(1.0)：有粮时饥饿应驱动 eat 而非外出采集；
      # 采集由 economy（囤粮）+ 无粮时的生存紧缺驱动。survival 仅用于让"断粮饥饿"压过 rest。
      # 打猎是「远途远征」：只在饱腹+田地封顶的农闲窗口出猎（economy 驱动），绝不能在饥饿时压过 eat，
      # 也不能在生长期压过 farm。故 survival 压到 0.1（几乎不满足即时生存），economy 提到 2.4 以补偿
      # 浅山往返 13 TU 的高额距离+体力惩罚（2.75），使封顶窗口 hunt(0.97) > fish(0.81)，但仍 < farm(1.30)。
      hunt: { survival: 0.1, economy: 2.4 }   # [调参] 任务10：纯经济远征动作
      fish: { survival: 0.8, economy: 0.7 }   # [调参] 任务10：渔业近镇补充生计。economy 0.7 让饱腹+田地封顶时 fish 有正分（林远/贫民靠捕鱼囤粮维生）；断粮饥饿时靠 survival 0.8 压过 rest 去捕鱼。贫民区→河边近路（单程 1.5 TU）让贫民捕鱼打分转正
    stamina_cost:                       # B5：动作固定体力消耗（移动另按 TU 计）
      eat: 0
      rest: 0
      farm: 20                          # [调参] 原 30
      collect_water: 10
      harvest: 20
      borrow_grain: 0
      hunt: 15                               # [调参] 任务10：25→15。林远家→浅山往返移动耗 65 体力，+15 刚好 ≤ 体力上限 80，使打猎可行；25 时 90>80 被 _can_afford 过滤导致打猎绝迹
      fish: 15                               # [调参] 任务10：捕鱼体力消耗（近镇，低于打猎）
    tu_cost:                            # C3：动作 TU 占用
      farm: 5
    outdoor: [farm, collect_water, harvest, hunt, fish]  # 任务10：捕鱼为户外，受雨天影响

  agriculture:                          # 04-03 新增：农田生长周期
    field_growth_per_farm: 2.0          # [调参] 里程碑3：360天历年，降增速避免初夏长势爆表（旧 5）
    max_field_growth: 100
    harvest_growth_threshold: 80        # 秋收前提：长势 ≥ 80
    harvest_grain_gain: 75              # [调参] 任务10：30→60→75，农业重回主食（3 田×秋收≈225石/年，超过渔业，与消费匹配）
    harvest_debt_repayment: 10          # [调参] 秋收偿还债务（石）——"偿还部分"未给具体值，暂取 10，待确认

  borrow:                               # 04-03 新增：借粮生存（第一版极简）
    borrow_grain_threshold: 2           # 存粮 < 此值触发借粮
    borrow_grain_amount: 5              # 每次借 5 石，同时等额计入债务

  debt:                                 # 任务08 新增：债务到期与催收节奏
    due_days: 180                       # 任务10 复核：保留 180 = 有意使到期跨越秋收窗口（秋收 tick181+），借款人有机会秋收后还款；非临时平衡
    collection_interval_days: 30        # [调参] 到期后每 30 天催收一次
    # 秋收还款上限复用 agriculture.harvest_debt_repayment(=10)；长势封顶复用 max_field_growth(=100)

  health:                               # 任务08 新增：健康回血
    health_recovery_per_day: 0.5        # [调参] 每日回血速率
    health_recovery_hunger_threshold: 40  # [调参] 饥饿低于此值才回血
    health_recovery_stamina_threshold: 50 # [调参] 体力高于此值才回血

  death:                                # 任务10 新增：死亡与失能生命周期
    incapacitation_health_threshold: 0  # health 触底（<=0）→ 失能，停止主动动作
    death_grace_ticks: 7                # 失能满 7 天仍未恢复 → 死亡（0=立即死亡）
    forgive_debt_on_death: true         # 死亡时核销剩余债务，写 debt_forgiven（可追溯，不静默消失）

  gathering:                            # 任务09 新增：采集类生计（打猎/捕鱼），代码不写死动作名
    actions:
      hunt:
        target_node: low_mountain       # 浅山（spatial-units.yaml 已有节点）
        output_field: meat              # 产出写入 AgentState.meat
        base_success_rate: 0.55         # [调参] 任务10：0.5→0.55，保证季节打猎不绝迹
        output_amount: 5                # [调参] 任务10：4→5，打猎产出回升为季节补充（秋季尤佳）
        injury_risk: 0.07               # [调参] 每次打猎受伤概率；任务09：0.1→0.07 减少非战斗减员
        injury_health_loss: 15          # [调参] 受伤健康损失
        season_modifier: {spring: 1.0, summer: 0.95, autumn: 1.3, winter: 1.1}  # [调参] 任务09：夏 0.8→0.95 缓解夏季断粮
        bad_weather_success_mult: 0.5   # [调参] 坏天气成功率乘数
        bad_weather_injury_mult: 2.0    # [调参] 坏天气受伤概率乘数
      fish:                             # 任务10 新增：渔业（配置驱动，走通用采集分支，不改核心结算）
        target_node: river_town         # 翠溪镇前段（近镇，spatial-units.yaml 已有水域节点）
        output_field: fish              # 产出写入 AgentState.fish
        base_success_rate: 0.45         # [调参] 任务10：0.55→0.45，渔业降为补充，避免过剩反超农业
        output_amount: 2                # [调参] 任务10：3→2，渔业降为补充，农业重回主食
        injury_risk: 0.02               # [调参] 捕鱼受伤概率（近镇缓流，低于打猎）
        injury_health_loss: 10          # [调参] 受伤健康损失
        season_modifier: {spring: 1.0, summer: 1.2, autumn: 1.1, winter: 0.7}  # [调参] 夏季鱼肥，冬季枯水减产
        bad_weather_success_mult: 0.4   # [调参] 坏天气成功率乘数（雨天河中难捕）
        bad_weather_injury_mult: 1.5    # [调参] 坏天气受伤概率乘数（路滑）

  time:
    tu_per_tick: 10                     # 1 Tick = 1 天 = 10 TU
    farm_tu: 5

agents:
  - id: lin_yuan
    name: 林远
    sex: male
    age: 18
    home_node: common_district
    work_node: west_field
    assets: { grain: 30 }               # 任务10：15→30，开春缓冲撑过第一个春夏到秋收（tick 181），避免多雨年份捕鱼失败饿死

  - id: zhao_cuilan
    name: 赵翠兰
    sex: female
    age: 23
    home_node: poor_district
    work_node: east_field
    assets: { grain: 35 }               # [调参] 任务10：3→22→35，贫农耕作者开春缓冲。多雨春季户外动作（捕鱼/耕作）打分减半→休息多、食物积累慢，22 石撑不到首次秋收（tick 181），3/5 种子饿死；35 石过桥，使其在多数年份存活、最恶劣年份仍可能饿死（涌现而非注定）

  - id: li_quan
    name: 李全
    sex: male
    age: 48
    home_node: rich_district
    work_node: south_field             # 任务10：独立南片田，不再与赵翠兰共用 east_field（避免收割互冲长势清零）
    assets: { grain: 100 }              # D1
