# 溪谷镇人物配置（brookvale-town-001）
# 数值来源：用户裁决（STATUS 里程碑2 A/B/C/D 类参数），设计文档未给的数值已获用户确认。
# 机制/内容分离：本文件提供所有具体数值；Python 代码只读，不写死。

# 说明：标注 [调参] 的为 04-03 阶段为修复"eat/rest 完全主导、无人耕作"而重选的数值，
# 标注 [机制修正] 的为打分量纲归一化；均待你审阅，可随时替换。
tuning:
  environment:
    fatigue_per_labor_tu: 0.3          # 普通劳动可由住宅睡眠恢复；持续超负荷才累积长期疲劳
    fatigue_per_travel_tu: 0.05
    dwelling_fatigue_recovery_per_day: 2.0
    dwelling_cold_protection: 0.75       # 完好住宅对冬季寒冷伤害的减免比例
    dwelling_resident_capacity: 5
    dwelling_comfort_ratio: 0.8
    dwelling_crowding_recovery_loss_per_ratio: 0.5
    outdoor_fatigue_recovery_per_day: 0.5
    fatigue_efficiency_threshold: 40
    fatigue_efficiency_grace_days: 7
    fatigue_efficiency_loss_per_point: 0.004
    max_fatigue_efficiency_loss: 0.3
    fatigue_affected_actions: [farm, harvest, hunt, fish, weave, construct]
    production_efficiency_by_building:
      workshop: {weave: 0.15}
    max_production_efficiency_bonus: 0.5
    bad_weather_injury_multiplier: 1.5
    construction_bad_weather_multiplier: 0.75
    construction_season_multiplier: {spring: 0.85, summer: 0.9, autumn: 0.65, winter: 0.75}
    service_capacity_by_node:
      well: {collect_water: 120}
      market: {market_visitors: 32}
    dwelling_reserve_ratio: 0.2
    building_need_emerging_days: 7
    building_need_persistent_days: 30
    building_need_priority_days: 90
    workshop_need_actions_per_30_days: 20
    community_food_reserve_capacity: 2000  # 仅显式自愿上交使用
    community_water_reserve_capacity: 1000  # 仅显式自愿上交使用
    household_water_reserve_days: 1         # 婚配预算/生育评估保留水量，不触发自动转存/救济
    building_condition_decay_per_day: 0.002
    building_weather_wear_multiplier: 1.5
    building_repair_need_condition_threshold: 60

  physiology:
    hunger_gain_per_tick: 15            # A1：每天饥饿增长
    eat_hunger_reduction: 60            # A2：进食降低饥饿
    eat_grain_cost: 1                   # A3：每次进食消耗粮食（石）
    daily_meals_per_member: 0.25        # 储备安全库存估算：饥饿+15/日、单餐恢复60，约每4日一餐
    food_fields: [grain, vegetable, meat, fish]  # [调参] 任务11：粮>菜>肉>鱼；粮不足依次吃后续字段
    hunger_health_damage_threshold: 80  # A4：饥饿超过此值开始掉健康
    hunger_health_damage: 8             # A4：每天健康损耗
    # 004：rest_stamina_recovery（rest +40）废弃——rest 为 1 TU 回满（机制常量）
    initial_health: 90                  # A6：开局健康
    initial_hunger: 40                  # A6：开局饥饿
    initial_stamina: 80                 # A6：开局体力
    initial_fatigue: 0                  # A6：开局疲劳

  utility:
    need_weights: { survival: 3.0, stamina: 2.0, economy: 1.5, food_security: 3.0, safety: 0.0, social: 0.0, family: 1.2 }  # [调参] family=未婚结亲/生育的持续动机；courtship 与 try_for_child 由它驱动
    economy_urgency_grain_zero: 1.0     # B2：断粮时经济紧缺度
    economy_urgency_grain_positive: 1.0 # [调参] 耕作始终有产出价值，故有粮时经济紧缺度也取 1.0（原 0.2/0.3）
    food_security_target_days: 12.0
    move_stamina_per_tu: 3              # [调参] 任务11 裁决：5→3。原值下贫民进山单程即耗尽体力；3.0 校准后日常 8–27%、进山 49–60%，阶段三白名单内可再调
    stamina_score_divisor: 500          # [调参] 004 新量纲重标定：旧平表单动作 8–30 → 分级后重活 100（25×4）会压过 gross，100→500 使"满体力重活"惩罚≈0.2，恢复"先干活后歇息"的量级关系；临时值，待长期方案复核
    distance_penalty_per_tu: 0.15       # [调参] B8：距离惩罚 = 往返 TU × 该值（原 2.0）
    rain_outdoor_score_multiplier: 0.5  # B9：雨天户外动作得分乘数
    household_task_priority_bonus: 0.75  # 家庭先分配互补任务；生存门控仍优先

  action:
    fulfill:                            # B4：动作对各需求的满足值
      eat: { survival: 1.0 }
      rest: { survival: 0.5, stamina: 1.0 }  # [调参] 原 0.6；新增 stamina 满足，体力越低越倾向休息
      farm: { economy: 1.8, food_security: 0.4 }            # [调参] 耕作的经济满足值
      collect_water: { survival: 0.55 }  # [调参] 任务30：水成为可积累资产后，打水是日常家务，空闲时略高于纯歇息（rest survival 0.5），但不压过 eat/farm/fish
      harvest: { economy: 4.0, food_security: 1.0 }         # 秋收：高经济满足，仅秋季且长势达标可行
      borrow_grain: { survival: 0.8 }
      borrow_food: { survival: 0.7 }   # 无粮可借时向有余食家庭借入
      # 婚育动作：由 family 需求驱动。court 仅在未婚且有候选时可行；
      # try_for_child 仅育龄女方、在生育闸内可行，效用另乘家庭资源安全度。
      court: { family: 1.0 }
      try_for_child: { family: 1.0 }
      # 采集类 survival 满足必须 < eat(1.0)：有粮时饥饿应驱动 eat 而非外出采集；
      # 采集由 economy（囤粮）+ 无粮时的生存紧缺驱动。survival 仅用于让"断粮饥饿"压过 rest。
      # 打猎是「远途远征」：只在饱腹+田地封顶的农闲窗口出猎（economy 驱动），绝不能在饥饿时压过 eat，
      # 也不能在生长期压过 farm。故 survival 压到 0.1（几乎不满足即时生存），economy 提到 2.4 以补偿
      # 浅山往返 13 TU 的高额距离+体力惩罚（2.75），使封顶窗口 hunt(0.97) > fish(0.81)，但仍 < farm(1.30)。
      hunt: { survival: 0.1, economy: 2.4, food_security: 0.7 }   # [调参] 任务10：纯经济远征动作
      fish: { survival: 0.8, economy: 0.7, food_security: 1.0 }   # [调参] 任务10：渔业近镇补充生计。economy 0.7 让饱腹+田地封顶时 fish 有正分（林远/贫民靠捕鱼囤粮维生）；断粮饥饿时靠 survival 0.8 压过 rest 去捕鱼。贫民区→河边近路（单程 1.5 TU）让贫民捕鱼打分转正
      weave: { economy: 1.2 }                 # [调参] 阶段三第1轮：economy 1.6→1.2。理由：挤出诊断（seed 0/7 × 1800）显示 farm 封顶后调用 0 次、零无效投入，挤出主因是 weave 在田块封顶后得分 1.17–1.53 高于 fish 0.54–0.72 / hunt 0.56–0.65，导致 +336 次额外织布、采集产出 1811→943。扫描 1.0/1.1/1.2/1.3/1.4：1.0 时织布近似消失（9–15 次），1.4 时重新压过捕捞并退化（seed7 存活 7）；1.2 时 weave 129–142 次、fish+hunt 1202–1210、east 收割 10、2 种子存活 12。影响：布料 236（远高于御寒阈值 3），织布保留且不压过捕捞
    # 004 裁决：stamina_cost 平表废弃——重活按 heavy_stamina_per_tu × tu_cost 结算
    # （连续 4 TU 归零）；轻活固定 0；移动另按 utility.move_stamina_per_tu 计。
    # rest = 1 TU 回满（机制常量）。
    tu_cost:                            # 004：动作 TU 占用（1 TU = 1 工作小时）[调参] 草案，待 M5 验收复核
      eat: 1                            # 做饭吃饭；≥1 防日内零成本动作循环
      rest: 1                           # 就地歇息 1 TU 回满
      farm: 4                           # 裁决：重活纯劳作 4 TU
      harvest: 4                        # [调参] 秋收同档重活
      hunt: 4                           # [调参] 远征打猎
      fish: 3                           # [调参] 捕鱼（近镇）
      weave: 2                          # [调参] 织布（室内轻活）
      collect_water: 1                  # [调参] 打水（轻活；任务30 已接产水）
      borrow_grain: 1                   # [调参] 借粮交涉
      court: 1                          # [调参] 结亲（就地表达意愿，无往返）
      try_for_child: 1                  # [调参] 求子（轻活）
      borrow_food: 1                    # 邻户借入鱼/肉/蔬菜
    heavy_actions: [farm, harvest, hunt]        # 004：重活名单（体力按速率结算）
    heavy_stamina_per_tu: 25            # 004 裁决：重活 4 TU 归零（25 × 4 = 100）
    outdoor: [farm, collect_water, harvest, hunt, fish]  # 任务10：捕鱼为户外，受雨天影响

  water:                                # 唯一饮用水源为公共水井；河流不自动视为饮用水
    collect_amount: 24                  # [调参][临时值] 每次取水并带回家庭的水量（12→24：大户单劳力日耗≈人数，12 时劳力须每日打水，断粮虚弱期打水断供全家断饮；24 降为隔日家务，待长期方案复核）
    daily_consumption_per_member: 1     # 每名存活成员每日饮水需求
    water_per_meal: 0.5                 # 每次进食烹饪/佐餐耗水；水不足则不能进食
    household_stock_target: 5           # 常态家庭存水目标
    scarcity_weight: 2.0                # 家庭缺水时的取水紧迫度
    seasonal_access_distance_tu: {spring: 4.5, summer: 4.0, autumn: 4.5, winter: 2.5}
    seasonal_reserve_days: {spring: 180, autumn: 90} # 远户在季节性不可达前自行储水

  agriculture:                          # 04-03 新增：农田生长周期
    field_growth_per_farm: 2.0          # [调参] 里程碑3：360天历年，降增速避免初夏长势爆表（旧 5）
    max_field_growth: 100
    harvest_growth_threshold: 80        # 秋收前提：长势 ≥ 80
    field_labor_per_farm: 4
    field_labor_required_by_season: {spring: 80, summer: 80, autumn: 0, winter: 0}  # 春夏各 20 次 farm；秋冬不再整地
    base_yield: { grain: 155, vegetable: 110 }  # [调参][临时值] 阶段二：crop_gain 更名 base_yield（crops.md §4.5）。75/55→105/75→155/110：2 年基线（seed 20261118）显示秋收产出只够约 52 人吃半年，第 2 年春荒必崩且崩后劳力不足无法恢复；再 +48% 把承载力抬到约 76 人，待长期方案复核
    harvest_debt_repayment: 10          # [调参] 秋收偿还债务（石）——"偿还部分"未给具体值，暂取 10，待确认

  borrow:                               # 04-03 新增：借粮生存（第一版极简）
    borrow_grain_threshold: 2           # 存粮 < 此值触发借粮
    borrow_grain_amount: 5              # 每次借 5 石，同时等额计入债务
    borrow_food_amount: 5               # 无粮可借时，每次向邻户借 5 单位鱼/肉/蔬菜
    food_lending_surplus_threshold: 10  # 债主保留至少 10 单位该物资
    food_resources: [fish, meat, vegetable]

  debt:                                 # 任务08 新增：债务到期与催收节奏
    due_days: 180                       # 任务10 复核：保留 180 = 有意使到期跨越秋收窗口（秋收 tick181+），借款人有机会秋收后还款；非临时平衡
    collection_interval_days: 7         # [调参][临时值] 到期后催收/核销检查间隔（30→7：40 年诊断显示断粮户死亡窗口约 9–16 天（饥饿 4 天触顶 + 健康 5 天归零 + 失能宽限 7 天），月度检查使断粮坏账核销来不及解锁救济；待长期方案复核）
    write_off_unpayable: true           # [调参] 到期分文未还且全家无粮时核销该笔坏账（debt_forgiven），防逾期锁死救济渠道
    # 秋收还款上限复用 agriculture.harvest_debt_repayment(=10)；长势封顶复用 max_field_growth(=100)

  health:                               # 任务08 新增：健康回血
    health_recovery_per_day: 0.5        # [调参] 每日回血速率
    health_recovery_hunger_threshold: 60  # [调参][临时值] 饥饿低于此值才回血（40→60：镇民每 4 天一餐、饥饿长期 40+，旧阈值使健康永不回升、婚育闸门恒闭，待长期方案复核）
    health_recovery_stamina_threshold: 50 # [调参] 体力高于此值才回血

  death:                                # 任务10 新增：死亡与失能生命周期
    incapacitation_health_threshold: 0  # health 触底（<=0）→ 失能，停止主动动作
    death_grace_ticks: 7                # 失能满 7 天仍未恢复 → 死亡（0=立即死亡）
    # 任务15：forgive_debt_on_death 无调用点，已删除；债务核销统一走继承结算 debt_written_off

  gathering:                            # 任务09 新增：采集类生计（打猎/捕鱼），代码不写死动作名
    actions:
      hunt:
        target_node: low_mountain       # 浅山（spatial-units.yaml 已有节点）
        harvests_resource_type: game    # P4 模型关联（2026-11-21 裁决③）：打猎采集的是猎物（game ↔ game_trail 兽径池）；行为切换（target 改指 game_trail）另立任务
        output_field: meat              # 产出写入 AgentState.meat
        base_success_rate: 0.55         # [调参] 任务10：0.5→0.55，保证季节打猎不绝迹
        output_amount: 5                # [调参] 任务10：4→5，打猎产出回升为季节补充（秋季尤佳）
        injury_risk: 0.035              # [调参] 004 新量纲重标定：旧 1 动作/日，日内 10 TU 可连续 2 次远征使受伤暴露翻倍；0.07→0.035 使「每日暴露」与旧基线相当。临时值，待长期方案复核
        injury_health_loss: 15          # [调参] 受伤健康损失
        season_modifier: {spring: 1.0, summer: 0.95, autumn: 1.3, winter: 1.1}  # [调参] 任务09：夏 0.8→0.95 缓解夏季断粮
        bad_weather_success_mult: 0.5   # [调参] 坏天气成功率乘数
        bad_weather_injury_mult: 2.0    # [调参] 坏天气受伤概率乘数
      fish:                             # 任务10 新增：渔业（配置驱动，走通用采集分支，不改核心结算）
        target_node: river_town         # 翠溪镇前段（近镇，spatial-units.yaml 已有水域节点）
        harvests_resource_type: fish    # P4 模型关联（2026-11-21 裁决③）：渔业采集鱼类（fish ↔ river_town 鱼池，归动物域）
        output_field: fish              # 产出写入 AgentState.fish
        base_success_rate: 0.45         # [调参] 任务10：0.55→0.45，渔业降为补充，避免过剩反超农业
        output_amount: 3.5              # [调参] 阶段三第1轮：2→3.5（+75%）。诊断：口粮缺口约 25%，鱼类是唯一随人口增长的人均产出项；2 时人口 500–800 tick 归零，3.5 时 2 种子 × 1800 tick 均存活。临时值，待长期方案复核
        injury_risk: 0.01               # [调参] 004 新量纲重标定：捕鱼 3 TU，日内可 3 次；0.02→0.01 保持每日暴露与旧基线相当。临时值，待长期方案复核
        injury_health_loss: 10          # [调参] 受伤健康损失
        season_modifier: {spring: 1.0, summer: 1.2, autumn: 1.1, winter: 0.7}  # [调参] 夏季鱼肥，冬季枯水减产
        bad_weather_success_mult: 0.4   # [调参] 坏天气成功率乘数（雨天河中难捕）
        bad_weather_injury_mult: 1.5    # [调参] 坏天气受伤概率乘数（路滑）

  market:                               # 任务11 新增：集市日结算撮合（以物易物，固定相对价格）
    market_node: market                 # 集市空地（spatial-units.yaml 已补 0.6 TU 距离）
    market_day_interval: 10             # [调参] 每 10 天一次，一年 36 次
    market_day_offset: 0                # [调参] tick % 10 == 0 为集市日
    market_min_stamina: 6               # [调参][临时值] 扣完往返赶路体力后仍需保留的门槛（15→6：断粮垂弱者也要能走到集市赊济，待长期方案复核）
    market_max_distance_tu: 6.0         # [调参] 单程上限：排除深山/远山，全镇四区均在范围内
    trade_values: { grain: 1.0, vegetable: 1.2, meat: 2.0, fish: 1.5, cloth: 3.0 }  # [调参] 相对价值
    surplus_threshold: { grain: 20, vegetable: 10, meat: 10, fish: 10, cloth: 5 }   # [调参] 富余：只卖超出部分
    deficit_threshold: { grain: 10, vegetable: 5, meat: 3, fish: 3, cloth: 1 }       # [调参] 短缺：只补到阈值（schema 要求 deficit < surplus）
    max_trade_units: 10                 # [调参] 单次成交 give 侧上限
    trade_unit_step: 0.5                # [调参] 成交量最小步长
    trade_value_tolerance: 0.2          # [调参] 交换价值相对误差容忍度
    credit:                             # 任务15 阶段二新增：集市赊账（零利息，当期交粮、到期还粮）
      enabled: true                     # 开启切片
      eligible_items: [fish, grain, meat, vegetable]           # 首切片只允许粮
      max_per_household: 60             # [调参][临时值] 单户未清偿赊账上限（30→180→60：180 等于给多孩户长期输血，粮从富户搬去养孩子，收回为 60——约一名成人 240 天口粮，够渡一次荒、不够长期养娃，待长期方案复核）
      due_days: 150                     # [调参][临时值] 赊账到期天数（60→300→150：300 天使 8 年仅 3 次到期窗口，"逾期不新增"的防雪球闸失效、赊账可无限滚动；收回为 150，兼顾跨一个生长季与防雪球，待长期方案复核）
      min_surplus: 45                   # [调参] 卖方至少余 45 才赊（须 > min_shortage）
      min_shortage: 30                   # [调参] 买方存粮 < 30 才赊入且按缺口补足（提高每次赊入缓冲，渡荒用）

  conflict:                             # 任务15 阶段二新增：债务纠纷（只做机制，不调参）
    debt_dispute:                       # 「有粮赖账」时的 2 轮私下催收；断粮走强制扣粮
      trigger_overdue_days: 30          # [调参] 逾期一月触发催收
      trigger_max_grain: 5              # [调参] 有粮上限：refusal_threshold < 存粮 ≤ 此值才进会话
      max_rounds: 2                     # 固定 2 轮（不可调；非 2 启动即报错）
      partial_ratio: 0.5                # [调参] 部分还款比例
      deferral_days: 60                 # [调参] 延期一季
      refusal_threshold: 2              # [调参] 库存不高于此值即拒绝；阶段三第1轮 0→2，须 < trigger_max_grain

  textile:                              # 任务11 新增：纺织与冬季保暖（布为耐用品，不每日消耗）
    cloth_per_weave: 2                  # [调参] 一次成功织布产量（匹）
    base_success_rate: 0.9              # [调参] 基础成功率
    season_modifier: { spring: 1.0, summer: 0.9, autumn: 1.0, winter: 0.8 }  # [调参] 冬季手僵减产
    warmth_cloth_threshold: 3           # [调参] 冬季御寒所需布量（达到即免寒冷惩罚）
    cold_health_loss: 2                 # [调参] 无布御寒时每日健康损失

  aging:                                # 任务12 新增：年龄分段与衰老
    life_stages:                        # [调参] 年龄分段：体力/健康上限乘数、劳作许可、受伤风险
      - { name: 幼年, min_age: 0, max_age: 8, stamina_max_mult: 0.40, stamina_recovery_mult: 0.80, health_max_mult: 0.70, work_allowed: false, injury_risk_mult: 0.5 }
      - { name: 少年, min_age: 8, max_age: 12, stamina_max_mult: 0.60, stamina_recovery_mult: 0.80, health_max_mult: 0.70, work_allowed: true, allowed_actions: [farm, harvest, weave], injury_risk_mult: 0.5 }  # [调参] 任务23 c1：实质劳动力（成人 50–60% 有效动作），不开 fish/hunt/borrow/collect_water；临时初值，待阶段三复核
      - { name: 青年, min_age: 12, max_age: 30, stamina_max_mult: 1.00, stamina_recovery_mult: 1.00, health_max_mult: 1.00, work_allowed: true, injury_risk_mult: 1.0 }
      - { name: 壮年, min_age: 30, max_age: 50, stamina_max_mult: 0.95, stamina_recovery_mult: 0.85, health_max_mult: 0.95, work_allowed: true, injury_risk_mult: 1.0 }
      - { name: 老年, min_age: 50, max_age: null, stamina_max_mult: 0.60, stamina_recovery_mult: 0.55, health_max_mult: 0.65, work_allowed: true, injury_risk_mult: 1.5 }
    health_cap_decline_start_age: 50    # [调参] 该年龄后健康上限每年下降
    health_cap_decline_per_year: 3      # [调参] D3：老年健康上限年衰减
    min_health_cap: 15                  # 域常量：健康上限下限（不再衰减到 0）
    natural_death_min_age: 55           # [调参] D4：自然死亡最低年龄（裁决：50→55）
    natural_death_health_threshold: 40  # [调参] D4：自然死亡健康阈值（裁决：60→40）
    injury_cause_window_days: 30        # 死因归类：受伤后多少天内死亡记为 injury

  marriage:                             # 任务12 新增：婚配资格
    min_age: 16                         # [调参]
    min_health: 40                      # [调参][临时值] 50→40：口粮节奏压低全镇健康均衡带（30–49），50 门槛使婚配恒闭，待长期方案复核
    max_distance_tu: 6.0                # [调参][临时值] 3.0→6.0：镇子半径 ~4.5 TU，3.0 上限使开局同居对之外无任何新婚配，婚育链条断裂，待长期方案复核
    allow_same_sex: false
    remarriage_allowed: true            # D5：允许鳏寡再婚
    forbid_close_kin: true              # D15：禁止亲子/同父/同母婚配
    bride_price_surplus_ratio: 0.1      # 彩礼按男方家庭扣除储备和债务压力后的可支配余量协商
    dowry_surplus_ratio: 0.0            # 默认未明确同意陪嫁；正值表示女方家庭自愿提供比例
    residence: patrilocal               # 第2步：只实现从夫居（其他枚举不实现）

  birth:                                # 任务12 新增：生育与新生儿
    min_age_female: 16                  # [调参]
    max_age_female: 45                  # [调参]
    max_age_male: 60                    # [调参]
    min_health: 40                      # [调参][临时值] 50→40：与婚配门槛同步，防健康均衡带压死生育，待长期方案复核
    interval_days: 300                  # [调参][临时值] D6 裁决 540→360，再 360→240：240 使 8 年大户膨胀到 12 人（10 个 0–6 岁幼童），单劳力抚养比爆炸且分家机制（丈夫须非户主）对开局户主户失效，崩塌户即此类大户；300 放缓大户膨胀并保留二代同期群规模，待长期方案复核
    chance_per_day: 0.02                # [调参][临时值] D6 0.02→0.03 又回 0.02：与 interval 联动控制受孕密度，目的同上，待长期方案复核
    low_population_adults: 2            # [调参] A5：成年人口下限阈值
    low_population_fertility_boost: 2.0 # [调参] A5：低人口时的生育概率乘数
    min_food_days: 150                  # [调参][临时值] 家庭存粮不足 150 天时女方不选求子：90 天闸下第一年仍有 19 个新生儿，人口冲高到 57 后再崩；150 使开局 100–140 天存粮的户在第 1 年秋收前不生育，待长期方案复核
    male_ratio: 0.5                     # 性别比例（seeded rng）
    newborn_health_parent_ratio: 0.8    # D7：父母均值 × 0.8
    newborn_stamina_parent_ratio: 0.8
    newborn_min_health: 30              # D7：最低值（配置化）
    newborn_min_stamina: 20
    initial_hunger: 40
    home_node_from: mother
    work_node_from: mother              # D8：母亲→父亲→家 兜底
    surname_from: father
    default_surname: 林
    given_names: [阿福, 阿寿, 小满, 春生, 秋生, 冬生, 水生, 禾生, 阿宁, 阿平, 阿安, 阿顺]
    name_fallback_suffix: "{name}{n}"
    asset_transfer_ratio: 0.1           # [调参] A4：出生时父母各转移 10% 食物
    mother_health_cost: 10              # 阶段二 §3.0：01-physical-state §4.4 普通分娩 health −10（设计值，非调参）；难产 −40 分支待设计补概率

  inheritance:                          # 任务12 新增：继承
    asset_ratio: 1.0
    debt_ratio: 0.5                     # [调参] D11：债务 0.5 转移、0.5 核销
    priority: [spouse, children, parents]  # D10：单继承人顺位
    escheat: true                       # D12：无继承人归公（只写事件，不建公账）

  dependency:                           # 任务12 新增：依赖者进食
    max_age: 16                         # [调参] D9：依赖年龄上限
    feed_from_parent: true

  consumption:                          # 阶段三第2轮新增：消费端系数
    minor_food_share: 0.7               # [调参] 未成年人单次进食库存扣减系数（成年恒 1.0，饥饿降低量不变）。诊断缺口 20–25%，消费端直接补缺口；临时值，待长期方案复核

  labor:                                # 阶段二 C：劳作点分配（修缺陷，不调参）
    allocation_policy: deterministic_distance  # 家庭可分配田块：默认田优先，其余按家→田距离+节点 id；户内按可劳作成员序对位接田

  split:                                # 任务12 第3步：分家
    min_members: 4                      # [调参] 户内人数下限（含夫妻与子女）
    asset_ratio: 0.5                    # [调参] 新户带走的资产/债务比例，余额留原户
    home_node_candidates: []            # 新户住所候选；空则同节点分户（稳定轮转）

  # 任务16 阶段二：社会认知与关系层（临时初值，待长期方案复核）
  social:
    memory_capacity: 5
    acquaintance_ttl: 360
    cleanup_interval: 360
    impression_in_decision: false       # [调参] 任务25 P2：印象参与债争诉求决策的独立开关；默认关闭，打开后 defaulting 档位触发全额诉求

