# Environment Seed 冻结契约（ADR 011 · P0，2026-11-26 冻结）。
# 来源：Xigu-Ecology-Data @ 52e0d55 的 processed/environment_seed_v2/seed_manifest_v3.json
#（Environment Seed v2 / manifest v3）。SHA-256 已对实际发布文件逐件复算核验一致。
# 锚点为 P0 身份核验后的 Brookvale ↔ brookvale-town-001 映射（世界级契约，非全局事实）。
# 数据包由部署环境下载/挂载到缓存根（B+C 裁决 2026-11-26）；本配置只含相对定位，
# 不写开发机绝对路径。升级 = 显式换 seed_id 与整节引用，旧版本可追溯、不原地覆盖。
environment_seed:
  seed_id: environment-seed-v3
  manifest_file: seed_manifest_v3.json
  manifest_package_dir: processed/environment_seed_v2/
  data_root_name: Xigu-Ecology-Data
  anchor:
    world_ref: brookvale-town-001
    lon: 104.126366
    lat: 35.875187
    albers_xy: [-394804.54, 327448.73]
  grid:
    # 自定义 WGS84 Albers Equal Area（米制，不冒用 EPSG）；本 Seed 的输入契约，
    # 不是 Kernel 全局默认网格参数。所有 GeoTIFF 资产须与本网格严格对齐。
    crs: '+proj=aea +lat_1=30 +lat_2=36 +lat_0=33 +lon_0=108.5 +datum=WGS84 +units=m +no_defs +type=crs'
    resolution_m: 30.0
    nodata: -9999        # 数值栅格基线 NoData；类别/掩膜资产的 NoData 冻结在资产级
    width: 668
    height: 666
    transform: [30.0, 0.0, -404820.0, 0.0, -30.0, 337440.0]
    # 每个栅格资产 WKT 必须包含的参数片段（冻结 Albers 关键参数，不引入 CRS 库）
    wkt_fragments:
      - 'PROJECTION["Albers_Conic_Equal_Area"]'
      - 'DATUM["WGS_1984"'
      - 'PARAMETER["latitude_of_center",33]'
      - 'PARAMETER["longitude_of_center",108.5]'
      - 'PARAMETER["standard_parallel_1",30]'
      - 'PARAMETER["standard_parallel_2",36]'
      - 'UNIT["metre",1'
  scope:
    # 模拟范围 = 以锚点为圆心、半径 10 km 的圆形（314.1 km²）；判定必须用
    # sim_extent_mask（圆内=1），不得用 bbox 或流域代替。
    shape: circle
    radius_m: 10000.0
    area_km2: 314.1
    pixel_count: 349046
    mask_asset: sim_extent_mask
  core_watershed:
    # 核心水文单元（8.55 km²，占模拟范围 2.72%）；不是全域 Mask。
    asset: watershed
    area_km2: 8.55
    share_of_scope_pct: 2.72
  source:
    repository: git@github.com:lenofrd/Xigu-Ecology-Data.git
    revision: 52e0d5517ea7d3d83c5641b9cf714d26fefe2944
    channel: github-release     # B 机制：正式分发渠道；Xigu 侧发布 Release 标签后回填
    release: null
    license: '上游 Copernicus DEM GLO-30、ESA WorldCover 2021 v200、HydroRIVERS v1.0；许可以各上游数据方条款为准（资产级溯源见 lineage，总链见 Xigu 数据契约 §5）'
    upgrade_policy: 版本显式切换，旧版本可追溯，不原地覆盖
  location:
    # C 机制：相对缓存根的包目录；缓存根 = VALE_SEED_CACHE 环境变量，缺省
    # <仓库根>/data/seed-cache（解析规则为 2026-11-26「有条件采纳」的临时实现，条件待老板明示）
    package_dir: environment_seed_v2
  required_assets:
    - asset_id: dem
      file: processed/environment_seed_v2/pilot_dem_30m.tif
      format: GeoTIFF
      status: active
      dtype: float32
      nodata: -9999
      size_bytes: 1477518
      sha256: d035790215b401291b600386aea45d5a75d85c9a5519fc13b675e4c04ecf1d53
      lineage: 'Copernicus DEM GLO-30 → VRT → 双线性标准化'
    - asset_id: slope
      file: processed/environment_seed_v2/pilot_slope_30m.tif
