      size_bytes: 1615137
      sha256: 099935dedd985ee433879bae76563c9c12170a52b8c7ac9a49150d8ffae4ffd6
      lineage: 'dem_30m_albers.tif → Horn'
    - asset_id: aspect
      file: processed/environment_seed_v2/pilot_aspect_30m.tif
      format: GeoTIFF
      status: active
      dtype: float32
      nodata: -9999
      size_bytes: 1602652
      sha256: 7d6631265b65d1e26b4ee10b6bdbe23811d507f4903e5185c13a7c70e5c2266d
      lineage: 'dem_30m_albers.tif → Horn'
    - asset_id: tpi_300m
      file: processed/environment_seed_v2/pilot_tpi_300m_30m.tif
      format: GeoTIFF
      status: active
      dtype: float32
      nodata: -9999
      size_bytes: 1672765
      sha256: a322e5fe8f582fcc4c2156b7bdbc218dd4ecf18e1ebb5afe0d5a6268ac2eda16
      lineage: 'dem_30m_albers.tif → 圆形邻域均值差'
    - asset_id: tpi_1000m
      file: processed/environment_seed_v2/pilot_tpi_1000m_30m.tif
      format: GeoTIFF
      status: active
      dtype: float32
      nodata: -9999
      size_bytes: 1675643
      sha256: 5b07a44ed86f9c8058bd06cf5381192229fe2e920db6ea7949b30d12fc5b7f48
      lineage: 'dem_30m_albers.tif → 圆形邻域均值差'
    - asset_id: tpi_3000m
      file: processed/environment_seed_v2/pilot_tpi_3000m_30m.tif
