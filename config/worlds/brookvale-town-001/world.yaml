      lineage: 'dem_30m_albers.tif → 圆形邻域均值差'
    - asset_id: worldcover
      file: processed/environment_seed_v2/pilot_worldcover_30m.tif
      format: GeoTIFF
      status: active
      dtype: uint8
      nodata: 0        # 0 为无数据，不是类别；类别码沿用 ESA 标准
      size_bytes: 66298
      sha256: df374a7d5183e28d01656e51d3d52ee4369500f884cbcec7a4c90cd7157fda5b
      lineage: '8 个 *_Map_screening.tif → Albers 30 m warp 合并'
    - asset_id: sim_extent_mask
      file: processed/environment_seed_v2/pilot_sim_extent_mask.tif
      format: GeoTIFF
      status: active
      dtype: uint8
      nodata: null     # 无 NoData 定义：圆外=0 是有效值（不是缺失）
      size_bytes: 4215
      sha256: f54af97b97dc6a1f52fa7b1852f7fed511291d3417f0394a19973bf469cfdb56
      lineage: '候选 6 中心 + 半径 10 km 圆形'
    - asset_id: watershed
      file: processed/environment_seed_v2/pilot_watershed_8_55km2_30m.tif
      format: GeoTIFF
      status: active
      dtype: uint8
      nodata: 0        # 流域内=1；0 为流域外（有效值，非缺失）
      size_bytes: 3188
      sha256: 303c7cb77f59b9712fce93a86f68ba66e4dadbb255ef3cabefce6cf3d68260c7
      lineage: 'H2 缓冲窗口 fix_flats 填洼 → D8 pointer → watershed → 裁入试点网格'
    - asset_id: rivers
      # 矢量资产：保留完整 LineString 几何；河段几何可超出 bbox（bounds 可达
      # bbox 外约 1–4 km），按查询目标显式裁剪，不直接累加 geometry.length。
      file: processed/environment_seed_v2/pilot_rivers.gpkg
