      geometry_types: [LineString]
      feature_count: 25
      bounds_albers_m: [-405503.04, 313286.41, -375867.97, 343550.68]
      size_bytes: 106496
      sha256: b1b82b9be203ad4c7f2a74b916fe4c9b14399e481983415d4457a236a6d5c9d9
      lineage: 'hydrorivers_qinling_daba_hanjiang_hanzhong_screening.gpkg → bbox ∩'

# Ecology Seed 冻结契约（EX-0，老板 2026-11-26 裁决有条件批准：契约冻结、
# 静态校验、完整性验证；E3/E4/E5 运行时消费暂缓）。
# 来源：Xigu-Ecology-Data @ 0343844 的 processed/ecology_seed_v1/（GitHub
# Release ecology-seed-v1.0）。manifest.json 自身哈希为 Viae 侧实测冻结
# （Xigu 变更日志曾把它误标为 SQLite 的哈希）；8 文件 size/sha256/rows 取自
# manifest 并经本机实际文件复算核验一致；7 表行数另冻结于 table_rows。
# 证据等级铁律（2026-11-26 裁决）：B 级记录不解释为精确空间分布；C 级关系
# 不转化为相互作用强度；D 级假设保留假设身份、不混入实测数据。
# initial_state.quantity_value 在本版本全部 NULL——不得用推测值填充（否决项）。
# 缓存根与 environment_seed 共用（VALE_SEED_CACHE / 缺省 data/seed-cache），
# 包目录隔离：environment_seed_v2 与 ecology_seed_v1 互不覆盖。
# 升级 = 显式换 seed_id 与整节引用，旧版本可追溯、不原地覆盖；学名/分类
# 变更换新版本线（Xigu 数据契约 §11）。
