[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vale"
version = "0.1.0"
description = "Vale Chronicle: a deterministic text town simulator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests", "viz/tests"]
pythonpath = ["src", "."]
markers = ["long_run: multi-year generational simulations, run in scheduled CI"]
