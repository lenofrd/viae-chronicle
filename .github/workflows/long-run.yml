name: long-run-generational-simulation

on:
  pull_request:
    paths:
      - "src/vale/**"
      - "config/worlds/**"
      - "tests/test_xigu_generational_sustainability.py"
      - ".github/workflows/long-run.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

jobs:
  generational-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run multi-decade generational simulation
        run: python -m pytest -q -m long_run
